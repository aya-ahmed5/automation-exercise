name: E2E Regression
on:
  push:
   branches:
    - master
  pull_request:
   branches:
    - master
  schedule:
    - cron: '0 21 * * *' # Runs every day at midnight
  workflow_dispatch:
env:
  TARGET: "%regex[.*Test.*],demoTest.**.**,demoTest.**"

jobs:
    chrome_linux:
      runs-on: ubuntu-latest
      permissions:
        checks: write
      steps:
        - name: Checkout code
          uses: actions/checkout@v5

        - name: Set up java
          uses: actions/setup-java@v3
          with:
            distribution: 'temurin'
            java-version: '21.0.8'

        - name: set up maven
          uses: stCarolas/setup-maven@v5
          with:
            maven-version: 3.9.11

        - name: Run E2E tests on Chrome (Linux)
          run: mvn -Dtest="${TARGET}" -DExcuation_Type="LocalHeadless" -Dbrowser_Type="chrome" clear test



    Edge_windows:
      runs-on: windows-latest
      permissions:
        checks: write
      steps:
        - name: Checkout code
          uses: actions/checkout@v3

        - name: Set up java
          uses: actions/setup-java@v3
          with:
            distribution: 'temurin'
            java-version: '21.0.8'

        - name: set up maven
          uses: stCarolas/setup-maven@v5
          with:
            maven-version: 3.9.11

        - name: Run E2E tests on edge (windows)
          run: mvn -Dtest="${TARGET}" -DExcuation_Type="LocalHeadless" -Dbrowser_Type="edge" clean test




